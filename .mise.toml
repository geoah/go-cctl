[tools]
go = "1.25"

[tasks."cctl:test"]
description = "Run cctl unit tests (no remote ssh / tmux required)"
run = '''
    set -euo pipefail
    go test ./...
    '''

[tasks."cctl:test:integration"]
description = "Run cctl integration tests — drives real local + workspace round-trips (worktree + tmux). Workspace tests skip automatically if unreachable."
run = '''
    set -euo pipefail
    go test -tags=integration -timeout=180s ./...
    '''

[tasks."cctl:install"]
description = "Install cctl into ~/.local/bin (and symlink from mise's go bin)"
run = '''
    set -euo pipefail

    # Primary install: ~/.local/bin so cctl survives Go-version upgrades and
    # is on PATH even when mise's go shim isn't active.
    global_bin="$HOME/.local/bin"
    mkdir -p "$global_bin"

    # Version comes from version.txt (managed by `mise run release`); Commit is
    # the short SHA for build provenance. So `cctl version` shows e.g.
    # "0.3.1 (a1b2c3d)".
    version="$(cat version.txt 2>/dev/null || echo dev)"
    commit="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
    GOBIN="$global_bin" go install -ldflags "-X github.com/geoah/go-cctl/pkg/cctl.Version=${version} -X github.com/geoah/go-cctl/pkg/cctl.Commit=${commit}" ./cmd/cctl

    # `go install` names the binary after the last path component of the
    # build target, which is `cctl` thanks to ./cmd/cctl — no rename
    # step needed.
    target="$global_bin/cctl"
    if [ ! -x "$target" ]; then
        echo "go install did not produce $target"
        exit 1
    fi
    echo "Installed:  $target"

    # Best-effort: also drop a symlink into mise's go bin so it stays on PATH
    # after future Go upgrades wipe ~/.local/share/mise/.../bin.
    mise_bin="$(go env GOBIN 2>/dev/null || true)"
    if [ -z "$mise_bin" ]; then
        mise_bin="$(go env GOPATH 2>/dev/null)/bin"
    fi
    if [ -n "$mise_bin" ] && [ -d "$mise_bin" ] && [ "$mise_bin" != "$global_bin" ]; then
        ln -sfn "$target" "$mise_bin/cctl"
        echo "Symlinked:  $mise_bin/cctl -> $target"
    fi
    '''

[tasks."cctl:build"]
description = "Build cctl into ./bin/cctl (for quick iteration / smoke tests)"
run = '''
    set -euo pipefail
    mkdir -p ./bin
    version="$(cat version.txt 2>/dev/null || echo dev)"
    commit="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
    go build -ldflags "-X github.com/geoah/go-cctl/pkg/cctl.Version=${version} -X github.com/geoah/go-cctl/pkg/cctl.Commit=${commit}" -o ./bin/cctl ./cmd/cctl
    echo "Built ./bin/cctl ($version)"
    '''

[tasks."hooks:setup"]
description = "Enable the repo git hooks (Conventional Commit lint on commit-msg)"
run = '''
    set -euo pipefail
    git config core.hooksPath .githooks
    chmod +x .githooks/* 2>/dev/null || true
    echo "Git hooks enabled (core.hooksPath=.githooks)."
    echo "Commit subjects are linted as Conventional Commits; cut a release"
    echo "locally with: mise run release"
    '''

[tasks.release]
description = "Cut a release locally: bump semver + CHANGELOG from commits, commit + tag (no push)"
run = '''
    set -euo pipefail
    ./scripts/release.sh "$@"
    '''

[tasks."release:dry"]
description = "Preview the next release (version bump + changelog) without writing anything"
run = '''
    set -euo pipefail
    ./scripts/release.sh --dry-run
    '''
