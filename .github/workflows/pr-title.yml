name: pr-title

# Lint the PR title as a Conventional Commit. We squash-merge, so the PR title
# becomes the commit subject on main — which is what release-please parses to
# compute the next version + changelog. This mirrors the local commit-msg hook
# (.githooks/commit-msg) for contributors who don't have it enabled.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with .githooks/commit-msg and scripts the release uses.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
