name: release-please

# Semantic versioning + Keep-a-Changelog + GitHub Releases, driven by
# Conventional Commits. On every push to main, release-please maintains a
# "release PR" that bumps version.txt and regenerates CHANGELOG.md from the
# commits since the last release. Merging that PR tags v<x.y.z> and publishes
# the GitHub Release. Config: release-please-config.json +
# .release-please-manifest.json.
#
# One-time repo setting: Settings → Actions → General → "Allow GitHub Actions
# to create and approve pull requests" must be enabled so the action can open
# the release PR.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
